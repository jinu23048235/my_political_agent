name: App and database checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: neighborhood_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d neighborhood_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DB_TEST_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/neighborhood_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run db:test
      - run: npm run build
      - run: npm run typecheck
