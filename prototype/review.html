<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>화면 검토 도구 · 우리동네이야기</title><style>body{font:14px/1.6 system-ui,sans-serif;color:#253b33;background:#f6f7f2;margin:0}header{padding:16px 24px}h1{font-size:18px;margin:0 0 5px}p{margin:4px 0;color:#66776a}label{display:inline-flex;gap:8px;margin:10px 18px 0 0}select{font:inherit;padding:5px}iframe{display:block;background:white;border:1px solid #dce5d6;width:calc(100% - 32px);height:85vh;margin:0 auto 16px}a{color:#24664b}</style></head><body><header><h1>화면 검토 도구</h1><p>이 페이지의 도구와 안내는 검토 전용입니다. 서비스 화면에는 표시하지 않습니다. 모든 인물·글은 예시이며 입력은 새로고침 시 초기화됩니다.</p><label>참여 상태 <select id="persona"><option value="resident">성산1동 인증 시민</option><option value="guest">로그아웃</option><option value="expired">인증 만료 시민</option><option value="staff">마포구 위임 직원</option></select></label><label>화면 너비 <select id="width"><option value="full">데스크톱 / 전체</option><option value="390">모바일 390px</option><option value="320">모바일 320px</option></select></label><a href="index.html" target="_blank" rel="noopener">서비스 화면만 열기</a></header><iframe id="preview" src="index.html" title="서비스 화면 초안"></iframe><script>const preview=document.querySelector('#preview');document.querySelector('#persona').onchange=e=>{preview.src='index.html?persona='+encodeURIComponent(e.target.value)};document.querySelector('#width').onchange=e=>{preview.style.width=e.target.value==='full'?'calc(100% - 32px)':e.target.value+'px';preview.style.maxWidth='calc(100% - 16px)'};</script></body></html>
